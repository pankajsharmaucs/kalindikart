name: Deploy KalindiKart

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}        # Your server IP
          username: ${{ secrets.SERVER_USER }}    # Usually 'root'
          key: ${{ secrets.SERVER_SSH_KEY }}      # Private key (from GitHub secret)
          port: ${{ secrets.SERVER_PORT }}        # Usually 22
          script: |
            echo "🚀 Deploying KalindiKart..."

            cd /var/www/kalindikart

            echo "📥 Pulling latest code"
            git reset --hard
            git pull origin main

            echo "📦 Installing dependencies"
            npm install

            echo "🏗️ Building app"
            npm run build

            echo "♻️ Restarting PM2"
            pm2 restart kalindikart || pm2 start npm --name "kalindikart" -- start

            pm2 save

            echo "✅ Deployment completed successfully"
