- name: Deploy KalindiKart
  uses: appleboy/ssh-action@v1.0.0
  with:
    host: ${{ secrets.SSH_HOST }}
    username: root
    port: ${{ secrets.SSH_PORT }}
    key: ${{ secrets.SSH_PRIVATE_KEY }}
    passphrase: ${{ secrets.SSH_PASSPHRASE }}
    script: |
      echo "🚀 Deploying KalindiKart..."
      cd /var/www/kalindikart
      git reset --hard
      git pull origin main
      npm install
      npm run build
      pm2 restart kalindikart || pm2 start npm --name "kalindikart" -- start
      pm2 save
      echo "✅ Deployment completed successfully"
